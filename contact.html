<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sophie Zhou — Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=94">
</head>
<body>
  <div class="page page-contact">
    <nav class="site-nav">
      <a class="site-logo" href="index.html">Sophie Zhou</a>
      <div class="site-links">
        <a href="index.html">Home</a>
        <a href="work.html">Work</a>
        <a href="resume.html">Resume</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>

    <main class="page-main">
      <header class="page-header contact-header">
        <h1 class="page-title contact-title">Contact</h1>
      </header>

      <div class="contact-layout">
        <form class="scrap scrap-torn scrap-rotate-left contact-form" action="#" method="post">
          <span class="tape tape-top-left"></span>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your name" autocomplete="name">

          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email">

          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Enter text here"></textarea>

          <button class="btn" type="submit">Send Message</button>
        </form>

        <div class="scrap scrap-torn scrap-rotate-right">
          <span class="tape tape-top-right"></span>
          <p class="issue-label">Elsewhere</p>
          <div class="contact-links">
            <a class="contact-link" href="mailto:slzhou@stanford.edu">slzhou@stanford.edu</a>
            <a class="contact-link" href="https://github.com/sophie-zhou" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a class="contact-link" href="https://www.linkedin.com/in/sophie-zhou-5025b8313/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a class="contact-link" href="https://www.instagram.com/soph.z.art?utm_source=qr" target="_blank" rel="noopener noreferrer">Art Instagram</a>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/site.js?v=44"></script>
</body>
</html>
